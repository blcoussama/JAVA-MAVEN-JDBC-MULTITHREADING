# Base MySQL locale pour BiblioTech.
# Les mots de passe ne sont pas écrits ici : ils viennent de l'environnement
# (variables exportées ou fichier .env non versionné, voir README).
#   docker compose up -d      # démarre MySQL et charge sql/schema.sql puis sql/seed.sql
#   docker compose down -v    # arrête et supprime les données
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bibliotech_db
      MYSQL_USER: ${BIBLIOTECH_DB_USER:-bibliotech}
      MYSQL_PASSWORD: ${BIBLIOTECH_DB_PASSWORD:?Definir BIBLIOTECH_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${BIBLIOTECH_DB_ROOT_PASSWORD:?Definir BIBLIOTECH_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${BIBLIOTECH_DB_PORT:-3307}:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - bibliotech-data:/var/lib/mysql
    healthcheck:
      # Répond dès que le serveur définitif écoute en TCP (pendant l'initialisation, il n'écoute pas).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bibliotech-data:
