name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests unitaires (Surefire) puis tests d'intégration (Failsafe) contre un MySQL 8.4
      # jetable démarré par Testcontainers (Docker est disponible sur ubuntu-latest).
      - name: Build et tests
        run: ./mvnw -B -ntp verify

  audit:
    name: Audit des dépendances (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Recherche de vulnérabilités connues (pom.xml, dépendances transitives)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
